apiVersion: v1
kind: Secret
metadata:
  name: mysql
  labels:
    component: mysql
    project: roboshop
    tier: app
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: "Um9ib3Nob3BAMQ=="
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      component: mysql
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        component: mysql
        project: roboshop
        tier: app
    spec:
      containers:
      - name: mysql
        image: shivanathbabu/mysql:v1
        envFrom:
        - secretRef:
            name: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: app
spec:
  selector:
    component: mysql
    project: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
        
