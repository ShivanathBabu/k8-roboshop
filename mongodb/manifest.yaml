apiVersion: apps/v1
kind: Deployement
metadata:
  name: mongodb
  namespace: roboshop
  # deployement labels
  labels: 
    component: mongodb
    project: roboshop
    tier: database 
spec:
  replicas: 1
  # These are the labels replica set use to create pod replicas, this should match pod labels
  selectors:
    matchlabels:
      component: mongodb
      project: roboshop
      tier: database
  # This is pod defination
  template:
    metadata:
      labels:
        component: mongodb
        project: roboshop
        tier: database
    spec:
      containers:
      - name: mongodb
        image: shivanathbabu/mongodb:v1
---
# service

apiVersion: v1
kind: service
metadata:
  name: mongodb
  labels:
    component: mongodb
    project: roboshop
    tier: database
spec:
  selector:
    component: mongodb
    project: roboshop
    tier: database
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017