apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo 
  labels:
    project: roboshop
    tier: app
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        project: roboshop
        tier: app
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-demo
  labels:
    project: roboshop
    tier: app
spec:
  selector:
    project: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
